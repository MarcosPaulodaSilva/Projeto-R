name: Logic Regression

on:
  pull_request:
    paths:
      - "unity/VadroniaDemo/Assets/Scripts/Core/**"
      - "unity/VadroniaDemo/Assets/Scripts/World/TownLayout.cs"
      - "unity/VadroniaDemo/Assets/Editor/Checks/CoreChecks.cs"
      - "unity/VadroniaDemo/Tests/**"
      - ".github/workflows/regression.yml"
  push:
    branches:
      - main
    paths:
      - "unity/VadroniaDemo/Assets/Scripts/Core/**"
      - "unity/VadroniaDemo/Assets/Scripts/World/TownLayout.cs"
      - "unity/VadroniaDemo/Assets/Editor/Checks/CoreChecks.cs"
      - "unity/VadroniaDemo/Tests/**"
      - ".github/workflows/regression.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run pure logic regression
        run: dotnet run --project unity/VadroniaDemo/Tests/Regression.csproj
